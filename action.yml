name: 'publish-action'
description: 'Auto publish cargo when git push new version in cargo.toml , and tagging it by this version'
branding:
  icon: 'arrow-up-circle'  # 图标的名称，不需要后缀
  color: 'blue'  # 可以选择图标颜色
inputs:
  DIR:
    description: 'Crate package directory path relative to the repository root (e.g. / or /project2/)'
    required: false
    default: "/"
  TAG_PREFIX:
    description: 'Prefix for the Git tag; full tag is {TAG_PREFIX}{version}'
    required: false
    default: ""
  USER_AGENT:
    description: 'Optional User-Agent header for GitHub API requests when creating the tag'
    required: false
    default: ""

outputs:
  new_version:
    description: "true if the version was not yet on all publish registries; false if already published (no publish attempt)"
  publish:
    description: "true or false when new_version was true — whether cargo publish and tag creation succeeded"
  new_version_value:
    description: "Semver published this run; only set when publish is true"

runs:
  using: 'docker'
  image: 'docker://ghcr.io/tu6ge/publish-action:v0.4.13'
